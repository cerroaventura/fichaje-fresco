<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a3347"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Fichaje Fresco</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f3f4;color:#2c2527;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.12)}img{width:180px;height:180px;object-fit:contain;border-radius:24px}h1{font-size:24px;margin:18px 0 6px}p{margin:0 0 18px;color:#66585d;line-height:1.45}.btn{width:100%;border:0;border-radius:12px;padding:16px 18px;font-weight:700;font-size:17px;cursor:pointer;margin-top:10px}#installBtn{background:#633044;color:#fff}#openBtn{display:block;text-decoration:none;background:#7a3347;color:#fff}#status{display:none;margin-bottom:12px;font-weight:700;color:#633044}small{display:block;margin-top:18px;color:#807177}</style></head><body><main class="card"><img src="./icon-512.png" alt="Fresco"><h1>Fichaje Fresco</h1><p id="subtitle">Instalá la aplicación para tener acceso directo desde tu celular.</p><div id="status">✓ Aplicación instalada</div><button id="installBtn" class="btn" hidden>INSTALAR APP</button><a id="openBtn" class="btn" href="https://script.google.com/macros/s/AKfycbwffD7IzOu0DASpHx2nK9RcIrB-u_IGkbvU-q8GNfOL2dkcpLWp6X2Akmfk9B2QIj6x/exec?empresa=fresco">ABRIR FICHAJE</a><small>Fresco · Tandil</small></main><script>let deferredPrompt=null;const installBtn=document.getElementById('installBtn'),status=document.getElementById('status'),subtitle=document.getElementById('subtitle');function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function installedUI(){installBtn.hidden=true;status.style.display='block';subtitle.textContent='La aplicación está lista. Ingresá al sistema de fichaje.'}if(isStandalone())installedUI();addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!isStandalone())installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!deferredPrompt){alert('Si no aparece la instalación automática, abrí el menú de Chrome y elegí “Instalar aplicación”.');return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});addEventListener('appinstalled',()=>{deferredPrompt=null;installedUI()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
